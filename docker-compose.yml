services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    depends_on:
      backend-api:
        condition: service_started
      clockify-sync:
        condition: service_started
    environment:
      BACKEND_API_URL: ${BACKEND_API_URL}
      CLOCKIFY_SYNC_URL: ${CLOCKIFY_SYNC_URL}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN}
      HOST: ${FRONTEND_HOST}
      PORT: ${FRONTEND_PORT}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    restart: unless-stopped

  backend-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-api
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN}
      PORT: ${BACKEND_API_PORT}
    restart: unless-stopped

  clockify-sync:
    build:
      context: .
      dockerfile: Dockerfile
      target: sync-service
    depends_on:
      backend-api:
        condition: service_started
    environment:
      CLOCKIFY_KEY: ${CLOCKIFY_KEY}
      CLOCKIFY_BASE_URL: ${CLOCKIFY_BASE_URL}
      BACKEND_API_URL: ${BACKEND_API_URL}
      API_INTERNAL_TOKEN: ${API_INTERNAL_TOKEN}
      PORT: ${CLOCKIFY_SYNC_PORT}
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mysql_data:
